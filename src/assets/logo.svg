<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="900" viewBox="0 0 1254 900" role="img" aria-labelledby="title desc">
  <title id="title">Camwyn &amp; Co</title>
  <desc id="desc">Camwyn and Co logo traced from the supplied original: open C, overlapping mountain mark, and company wordmark. Black on transparent.</desc>

  <!-- Filled silhouette preserves the original C's straight, vertical-cut terminals. -->
  <path fill="#000" fill-rule="evenodd" d="
    M790 259
    C742 228 688 212 628 212
    C484 212 375 319 375 463
    C375 606 484 699 628 699
    C688 699 742 683 790 653
    L790 592
    C745 631 691 652 631 652
    C515 652 433 579 433 463
    C433 347 515 240 631 240
    C691 240 745 259 790 326
    Z"/>

  <!-- Mountain geometry follows the three separate overlapping strokes in the reference. -->
  <g fill="none" stroke="#000" stroke-width="19" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Tall open rear peak -->
    <path d="M486 583 L628 421 L688 483"/>

    <!-- Small foreground peak and its extended horizontal base -->
    <path d="M535 588 L608 511 L680 588 M535 588 H742"/>

    <!-- Independent right peak -->
    <path d="M657 532 L720 466 L847 590"/>
  </g>

  <!-- Original wide, light geometric wordmark. No background is drawn. -->
  <text x="627" y="822" fill="#000" text-anchor="middle"
        font-family="Century Gothic, Montserrat, Avenir Next, Futura, Arial, sans-serif"
        font-size="82" font-weight="400" letter-spacing="15">CAMWYN &amp; CO</text>
</svg>
