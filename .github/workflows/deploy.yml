name: 🚀 Deploy Camwyn & Co on push

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC to automatically publish scheduled drafts
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📡 Ingest Ivy Page Dispatches
        run: node scripts/sync-ivy-dispatches.js

      - name: 💾 Commit newly syndicated dispatches
        run: |
          if [ -n "$(git status --porcelain src/notes/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/notes/
            git commit -m "chore(syndication): auto-sync new Ivy Page dispatches [skip ci]"
            git push
          fi

      - name: 🧪 Run Accessibility & Contrast Tests
        run: npm test

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          local-dir: ./_site/
          dangerous-clean-slate: false
